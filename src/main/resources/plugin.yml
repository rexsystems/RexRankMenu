name: RexRankMenu
version: '${project.version}'
main: me.rexsystems.rexRankMenu.RexRankMenu
api-version: '1.21'
folia-supported: true
authors: [RexSystems]
description: Buy the next LuckPerms rank from a menu
website: https://rexsystems.me
softdepend: [LuckPerms, PlaceholderAPI, Vault]

commands:
  rexrankmenu:
    description: Open the rank menu
    aliases: [rrank, rank]
    usage: /rexrankmenu <open|reload|help>

permissions:
  rexrankmenu.use:
    description: Open your own rank menu
    default: true
  rexrankmenu.reload:
    description: Reload RexRankMenu
    default: op
  rexrankmenu.admin:
    description: Open the rank menu for another player
    default: op
  rexrankmenu.buy:
    description: Buy the next rank
    default: true
